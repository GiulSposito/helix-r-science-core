code: rds
name: "RDS: R Data Science"
description: "10-Phase Framework for R Data Science Excellence — From raw data to production deployment"
module_version: 1.1.0
default_selected: false
module_greeting: >
  RDS Module Installed Successfully!

  The R Data Science module is now available with 4 specialized agents:

  Ada (Project Architect) - Setup, Import, Clean (Phases 1-3)
      Invoke: /ada

  Grace (Data Scientist) - EDA, Features (Phases 4-5)
      Invoke: /grace

  Alan (ML Engineer) - Build, Tune, Evaluate (Phases 6-8)
      Invoke: /alan

  Marie (Communicator) - Report, Deploy (Phases 9-10)
      Invoke: /marie

  Quick Start:
  - New project? Start with Ada (/ada)
  - Have clean data? Start with Grace (/grace)
  - Features ready? Start with Alan (/alan)
  - Model trained? Start with Marie (/marie)

  Happy data sciencing!

agents:
  - code: ada
    name: Ada
    title: The Project Architect
    icon: "🏗️"
    description: Foundation Specialist for R Data Science projects (Phases 1-3 - Setup, Import, Clean). Expert in reproducibility, data quality validation, and tidyverse data preparation.
  - code: grace
    name: Grace
    title: The Data Scientist
    icon: "🔬"
    description: Exploration & Feature Specialist for R Data Science projects (Phases 4-5 - EDA, Features). Expert in ggplot2 visualization, systematic data exploration, and tidymodels recipes framework.
  - code: alan
    name: Alan
    title: The ML Engineer
    icon: "🤖"
    description: Modeling & Optimization Specialist for R Data Science projects (Phases 6-8 - Build, Tune, Evaluate). Expert in tidymodels workflows, systematic model comparison, and rigorous validation protocols.
  - code: marie
    name: Marie
    title: The Communicator
    icon: "📊"
    description: Communication & Deployment Specialist for R Data Science projects (Phases 9-10 - Report, Deploy). Expert in Quarto reporting, Shiny dashboards, and Vetiver deployment.

rds_workflows_path:
  prompt: "Path for RDS workflows?"
  default: "{project-root}/_bmad/rds/workflows"
  result: "{value}"

rds_sidecar_memory:
  prompt: "Path for agent sidecar memory?"
  default: "{project-root}/_bmad/_memory"
  result: "{value}"
